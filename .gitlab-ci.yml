include:
  - template: Code-Quality.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

stages:
  - build
  - test
  - quality
  - deploy
  - staging

unit_test:
  stage: test
  image: hubdocker.libriciel.fr/php:8.3
  tags:
    - runner-citoyen
  before_script:
    - apt-get -y update && apt-get -y install git zip zlib1g-dev libzip-dev
    - docker-php-ext-install zip
    - pecl install xdebug && docker-php-ext-enable xdebug
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin
    - mv /usr/local/bin/composer.phar /usr/local/bin/composer
  variables:
    XDEBUG_MODE: coverage
  script:
    - composer install
    - vendor/bin/phpunit --coverage-text --colors=never --coverage-clover coverage/coverage.xml --log-junit coverage/logfile.xml
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    paths:
      - coverage
    expire_in: 1h

code_quality:
  services:
  tags:
    - cq-sans-dind